name: Release

on:
  push:
    tags: ['tools-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Date-based toolchain version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f6eb1623d0e68773
        with:
          go-version: '1.26.0'
          cache: true
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          value="$INPUT_VERSION"
          if [[ -z "$value" ]]; then value="${REF_NAME#tools-v}"; fi
          [[ "$value" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - run: bash scripts/build.sh --version '${{ steps.version.outputs.value }}' --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --output dist
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: tools-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: tools-*
          path: dist
          merge-multiple: true
      - run: |
          version="${GITHUB_REF_NAME#tools-v}"
          python3 scripts/verify_release.py dist --version "$version"
          cp locks/tools.lock.json dist/tools.lock.json
          mkdir -p license-stage
          zstd -dc "dist/argus-tools_${version}_linux_amd64.tar.zst" | tar -xf - -C license-stage ./licenses
          tar --sort=name --owner=0 --group=0 --numeric-owner -C license-stage -cf - . | zstd -19 -T0 -q -o dist/THIRD_PARTY_LICENSES.tar.zst
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ARGUS tools $version" --notes "Atomic seven-tool ARGUS release. Every upstream source and license is pinned in tools.lock.json."
        env:
          GH_TOKEN: ${{ github.token }}
